spring:
  application:
    name: similar-products
  cache:
    type: caffeine
    cache-names: products,similarIds
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=60s
  threads:
    virtual:
      enabled: true

server:
  port: 5000

products:
  api:
    base-url: http://localhost:3001
    connect-timeout: 500ms
    read-timeout: 1500ms
